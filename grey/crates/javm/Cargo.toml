[package]
name = "javm"
version = "0.4.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Join-Accumulate VM (JAVM)."

[features]
default = ["std"]
std = ["libc", "memoffset", "grey-crypto"]

[dependencies]
grey-crypto = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
memoffset = { version = "0.9", optional = true }
# Non-workspace dep lines: the workspace pins enable default features (std),
# and workspace-inherited features are additive. javm's always-compiled
# modules must stay no_std-clean (thiserror 2 derives core::error::Error
# without its std feature).
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
